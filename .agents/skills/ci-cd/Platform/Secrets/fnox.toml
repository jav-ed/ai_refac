default_provider = "age"

[providers."age"]
type = "age"
recipients = [
  "age1uy9ps3p4460de20v8fgvt6gyg5ml0wscesd32m4693567aaumgnsspt8x5",
  "age1areaucgxqcwvnsnr3mpz46g27pc9gf8qqcvaaa3k5fn3fluvde3s27cql9",
]

[secrets]
# Shared secret used by the Woodpecker server and Woodpecker agent to trust each
# other. Injected into both services by `fnox exec`; not a user/API token.
WOODPECKER_AGENT_SECRET= { provider = "age", value = "" }

# Forgejo OAuth application client ID used by the Woodpecker server so users can
# log in with Forgejo. This is service OAuth config, not a Forgejo API token.
WOODPECKER_FORGEJO_CLIENT= { provider = "age", value = "" }

# Forgejo OAuth application client secret paired with
# `WOODPECKER_FORGEJO_CLIENT`. Used by Woodpecker server during Forgejo OAuth
# login. This is service OAuth config, not a Forgejo API token.
WOODPECKER_FORGEJO_SECRET= { provider = "age", value = "" }

# Woodpecker user API token for read-only and admin API checks against
# `https://ci.zetunweb.com`. Used by agents through `fnox exec`; do not use
# it as a Forgejo token and do not print it in logs.
WOODPECKER_API_TOKEN= { provider = "age", value = "" }

# Forgejo API token used for repo and webhook checks against
# `https://git.zetunweb.com/api/v1`. Used by agents through `fnox exec`; do not
# use it as a Woodpecker token and do not print it in logs.
FORGEJO_API_TOKEN= { provider = "age", value = "" }

# Persistent JWT-signing secret for the Woodpecker server's gRPC connections.
# Required from v3.17 onward so restarts do not rotate the temporary generated key.
WOODPECKER_GRPC_SECRET= { provider = "age", value = "" }

# Cloudflare API token used by Caddy for DNS-01 certificate issuance for `ci.zetunweb.com`.
# Injected into Caddy by `fnox exec`; not a Forgejo or Woodpecker API token.
CF_API_TOKEN= { provider = "age", value = "" }
