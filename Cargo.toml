[package]
name = "refac"
version = "0.1.4"
edition = "2024"
rust-version = "1.99"
default-run = "refac"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
clap_mangen = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
async-trait = "0.1"
schemars = { version = "1.2", features = ["derive"] }
lsp-types = "0.97.0"
url = "2.5.7"
# CommonMark parser for the Markdown backend: decides what is a link (code blocks,
# comments, and HTML are not) while refac reads the destination ranges itself.
pulldown-cmark = { version = "0.13", default-features = false }
# Finds the Markdown files a move can affect, honouring .gitignore like git does.
ignore = "0.4"
# Link destinations are URLs: `My%20Notes.md` is the file `My Notes.md`.
percent-encoding = "2"
which = "8.0.0"
pathdiff = "0.2"
walkdir = "2.5"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tempfile = "3.8"
ra_ap_hir = "=0.0.357"
ra_ap_ide = "=0.0.357"
ra_ap_load-cargo = "=0.0.357"
ra_ap_project_model = "=0.0.357"
ra_ap_syntax = "=0.0.357"
ra_ap_vfs = "=0.0.357"


# Build size, in disk. The library embeds rust-analyzer, and every file directly in
# tests/ is its own program that links all of it. With cargo's default full debug
# info each such program is about 560 MB, so a full `cargo test` build wrote ~19 GB
# and filled a sandbox's fixed disk allowance (the linker then dies with
# "Bus error"). Without debug info a test program is about 90 MB.
# Dependencies never get debug info; this crate keeps line tables, so a panic or
# RUST_BACKTRACE=1 still names file and line. Need full debugger info for one run?
#   CARGO_PROFILE_DEV_DEBUG=true cargo test --test <name>
# (a different debug setting rebuilds everything, so delete target/ afterwards).
# See Project_Manag/Docs/Setup/resource_Use.md.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false
